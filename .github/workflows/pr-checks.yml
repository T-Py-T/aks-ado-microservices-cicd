name: Pull request checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Validate repository policy
        run: python -m unittest tests.test_repository_policy

      - name: Audit Python dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          python -m compileall -q src/emailservice src/loadgenerator src/recommendationservice
          pip-audit -r src/emailservice/requirements.txt
          pip-audit -r src/loadgenerator/requirements.txt
          pip-audit -r src/recommendationservice/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: "24"

      - name: Test and audit Node.js services
        run: |
          for service in currencyservice paymentservice; do
            (
              cd "src/$service"
              npm ci
              npm audit --omit=dev
            )
          done
          node tests/node_service_smoke.js src/currencyservice server.js "CurrencyService gRPC server started" 17000
          node tests/node_service_smoke.js src/paymentservice index.js "PaymentService gRPC server started" 15000

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: false

      - name: Validate Kubernetes resources
        run: go run github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0 -strict -summary deployment-service.yaml

      - name: Test Go services
        run: |
          for service in checkoutservice frontend productcatalogservice shippingservice; do
            (cd "src/$service" && go test ./...)
          done

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Test cart service
        run: dotnet test src/cartservice/tests/cartservice.tests.csproj --configuration Release

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      - name: Build ad service
        working-directory: src/adservice
        run: ./gradlew --no-daemon build
